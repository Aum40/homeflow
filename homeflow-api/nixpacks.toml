# Nixpacks จะใส่ pnpm 9 จาก nix มาให้เอง ซึ่งชนะใน PATH ทับตัวที่เราติดตั้ง
# แล้วพังเพราะ pnpm 9 บังคับให้ pnpm-workspace.yaml ต้องมีฟิลด์ packages
# (ERROR packages field missing or empty) จึงตัดออกจาก setup แล้วติดตั้ง
# pnpm 11.5.2 ผ่าน npm เองให้ตรงกับ packageManager ใน package.json
# openssl ต้องคงไว้ -- prisma ต้องใช้
[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
cmds = [
  "npm i -g pnpm@11.5.2",
  "pnpm --version",
  "pnpm i --frozen-lockfile"
]
